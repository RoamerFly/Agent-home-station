name: Source checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install media test tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Check tracked files and credentials
        run: python scripts/check_repository.py
      - name: Check Go formatting
        shell: bash
        run: |
          files=$(gofmt -l cmd internal)
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi
      - name: Check JavaScript syntax
        run: find internal/admin/static -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build server commands
        run: go build ./cmd/...
