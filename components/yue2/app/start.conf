# ============================================================================
# 自定义环境变量 —— 一行一个 KEY=VALUE，# 开头为注释。
# 启动器会读取本文件并注入到 webui.py 及其子进程（含 ComfyUI）的运行环境。
#
# 路径约定（重要）：
#   * 下面这些“目录类”变量若写成相对路径，启动器会自动把它解析为相对【本 app
#     目录】的绝对路径后再注入，保证 webui.py 与 ComfyUI 两个进程指向同一位置。
#   * 缓存类目录统一放在 cache/ 下 —— 顶部「更多 → 清除缓存」会清空 app/cache。
#   * 模型下载目录统一放在 models/ 下 —— 不会被“清除缓存”删除。
#   * 值里不要写引号、= 右边不要有空格（跨 Windows / macOS 通用）。
# ============================================================================

# ---- 网络 ----
NO_PROXY=127.0.0.1,0.0.0.0,localhost
# 只使用整合包内置环境，忽略用户家目录下的 site-packages。
PYTHONNOUSERSITE=1

# ============================================================================
# 模型下载目录（放在 models/ 下，不随“清除缓存”删除）
# ============================================================================
# HuggingFace：HF_HOME 是总目录，模型 hub 缓存 / token / datasets 都在它下面，
# 一般只设它即可（它会自动派生出 hub、datasets 等子目录）。
HF_HOME=models/huggingface

# ModelScope（魔搭）模型缓存目录。
MODELSCOPE_CACHE=models/modelscope

# PyTorch Hub / 预训练权重（torch.hub、部分模型库会用到）。
TORCH_HOME=models/torch

# --- 可选：国内加速与下载优化（需要时去掉行首 # 开启）---
# HuggingFace 国内镜像（下载慢/连不上时开启）：
# HF_ENDPOINT=https://hf-mirror.com
# 启用更快的下载后端（需已安装 hf_transfer）：
# HF_HUB_ENABLE_HF_TRANSFER=1
# 兼容仍读旧变量的库（设了 HF_HOME 通常无需再设，且新版会有弃用告警）：
# HUGGINGFACE_HUB_CACHE=models/huggingface/hub
# TRANSFORMERS_CACHE=models/huggingface/hub

# ============================================================================
# 运行缓存目录（放在 cache/ 下，可被“清除缓存”清空）
# ============================================================================
# Gradio 临时文件（上传的图片/视频、处理中间产物等）。
GRADIO_TEMP_DIR=cache/gradio
# matplotlib 字体/配置缓存（避免写到用户家目录 ~/.matplotlib）。
MPLCONFIGDIR=cache/matplotlib
# pip 缓存目录（如在应用内触发安装时使用）。
PIP_CACHE_DIR=cache/pip
PYTHONUNBUFFERED=1
PYTHONIOENCODING=utf-8
